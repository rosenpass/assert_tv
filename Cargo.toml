[workspace]
resolver = "2"
members = ["assert_tv", "assert_tv_macros", "example"]

[workspace.package]
version = "0.6.10"
categories = ["development-tools", "development-tools::testing"]
authors = ["Amin Faez <amin.faez.inbox@gmail.com>", "Karolin Varner <karo@rosenpass.eu>"]
description = "De-randomized detereministic tests with test-vectors"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rosenpass/assert_tv"
keywords = ["macro", "test", "test-driven", "test-helpers", "test-vectors"]

[workspace.dependencies]
# Internal crates
assert_tv = { path = "assert_tv", version = "0.6.10" }
assert_tv_macros = { path = "assert_tv_macros", version = "0.6.10" }

# External crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
toml = "1.1.8"
log = "0.4.34"
anyhow = "1.0"
zstd = "0.14.3"
base64 = "0.23.1"
rand = "0.10.3"
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
