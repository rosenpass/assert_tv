[workspace]
resolver = "2"
members = ["assert_tv", "assert_tv_macros", "example"]

[workspace.package]
version = "0.6.8"
categories = ["development-tools", "development-tools::testing"]
authors = ["Amin Faez <amin.faez.inbox@gmail.com>"]
description = "De-randomized detereministic tests with test-vectors"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rosenpass/assert_tv"
keywords = ["macro", "test", "test-driven", "test-helpers", "test-vectors"]

[workspace.dependencies]
# Internal crates
assert_tv = { path = "assert_tv", version = "0.6.8" }
assert_tv_macros = { path = "assert_tv_macros", version = "0.6.8" }

# External crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
toml = "1"
log = "0.4"
anyhow = "1"
zstd = "0.14"
base64 = "0.23"
rand = "0.10"
syn = { version = "3.0", features = ["full"] }
quote = "1"
proc-macro2 = "1"
